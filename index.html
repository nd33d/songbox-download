<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101014">
  <title>SongBox – Dein Song</title>
  <style>
    :root {
      color-scheme: dark;
      --violet: #8e24aa;
      --blue: #1976d2;
      --card: rgba(24, 24, 31, .88);
      --muted: rgba(255, 255, 255, .68);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 15% 5%, rgba(142, 36, 170, .28), transparent 38%),
        radial-gradient(circle at 90% 90%, rgba(25, 118, 210, .28), transparent 42%),
        #101014;
      font-family: "Arial Black", Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .23;
      background-image: radial-gradient(rgba(255,255,255,.24) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(to bottom, #000, transparent 80%);
    }

    header {
      min-height: 64px;
      padding: max(14px, env(safe-area-inset-top)) 20px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(90deg, #7b1fa2, #1976d2);
      box-shadow: 0 5px 24px rgba(0, 0, 0, .3);
    }

    .brand { font-size: clamp(21px, 6vw, 28px); letter-spacing: 1px; }
    .brand span { opacity: .72; font-size: .55em; vertical-align: middle; }

    main {
      position: relative;
      width: min(100% - 28px, 540px);
      margin: 0 auto;
      padding: 34px 0 max(36px, env(safe-area-inset-bottom));
      text-align: center;
    }

    .disc-wrap {
      width: 156px;
      height: 156px;
      margin: 0 auto 24px;
      padding: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet), var(--blue));
      box-shadow: 0 0 42px rgba(123, 31, 162, .52);
    }

    .disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: repeating-radial-gradient(circle, #26262d 0 4px, #151519 5px 9px);
      animation: spin 5s linear infinite;
      animation-play-state: paused;
    }

    .loading .disc { animation-play-state: running; }
    .disc::before {
      content: "♫";
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 27px;
      background: linear-gradient(135deg, var(--violet), var(--blue));
      border: 4px solid #eee;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .card {
      padding: 26px clamp(18px, 6vw, 32px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 18px 52px rgba(0,0,0,.34);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #bca7ff;
      font: 700 12px Arial, sans-serif;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(27px, 8vw, 42px);
      line-height: 1.05;
    }

    #status {
      min-height: 48px;
      margin: 20px 0 16px;
      color: var(--muted);
      font: 600 16px/1.45 Arial, sans-serif;
    }

    .progress {
      height: 8px;
      margin: 0 0 22px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
    }

    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--violet), #bb58d1, var(--blue));
      transition: width .25s ease;
    }

    button {
      width: 100%;
      min-height: 58px;
      padding: 14px 20px;
      border: 2px solid rgba(255,255,255,.7);
      border-radius: 17px;
      color: #fff;
      background: linear-gradient(135deg, var(--violet), var(--blue));
      box-shadow: 0 9px 26px rgba(25, 118, 210, .25);
      font: 900 17px Arial, sans-serif;
      cursor: pointer;
      transition: transform .12s ease, opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.98); }
    button:disabled { cursor: wait; opacity: .42; }

    .hint {
      margin: 14px 0 0;
      color: rgba(255,255,255,.48);
      font: 13px/1.45 Arial, sans-serif;
    }

    .setup {
      display: none;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.1);
      text-align: left;
    }

    .setup.visible { display: block; }
    label { display: block; margin: 12px 0 6px; font: 700 13px Arial, sans-serif; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 11px;
      outline: none;
      color: #fff;
      background: rgba(0,0,0,.28);
      font: 14px Arial, sans-serif;
    }
    input:focus { border-color: #7db9ff; }
    .setup button { margin-top: 16px; }

    .error #status { color: #ffaaa3; }
    .ready .progress > span { width: 100% !important; }

    @media (prefers-reduced-motion: reduce) {
      .disc { animation: none; }
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header><div class="brand">🎵 SongBox <span>DOWNLOAD</span></div></header>
  <main id="app">
    <div class="disc-wrap"><div class="disc"></div></div>
    <section class="card">
      <p class="eyebrow">Dein persönlicher Song</p>
      <h1 id="title">SongBox Hit</h1>
      <p id="status" role="status" aria-live="polite">Download wird vorbereitet …</p>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <button id="download" type="button" disabled>⬇ Song herunterladen</button>
      <p class="hint" id="hint">Falls dein Browser nicht automatisch startet, tippe auf den Button.</p>

      <form class="setup" id="setup">
        <p class="hint">Zum lokalen Testen eine öffentliche MP3-Adresse einfügen:</p>
        <label for="url-input">MP3-Adresse</label>
        <input id="url-input" type="url" inputmode="url" placeholder="https://…/song.mp3" required>
        <label for="title-input">Songtitel</label>
        <input id="title-input" type="text" value="Mein Song" maxlength="100">
        <button type="submit">Test starten</button>
      </form>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const app = document.querySelector("#app");
      const title = document.querySelector("#title");
      const status = document.querySelector("#status");
      const bar = document.querySelector("#bar");
      const button = document.querySelector("#download");
      const setup = document.querySelector("#setup");
      const urlInput = document.querySelector("#url-input");
      const titleInput = document.querySelector("#title-input");
      let objectUrl = "";
      let filename = "SongBox-Song.mp3";
      let busy = false;

      function parameters() {
        return new URLSearchParams(location.hash.replace(/^#/, ""));
      }

      function safeFilename(value) {
        const clean = String(value || "SongBox-Song")
          .normalize("NFC")
          .replace(/[<>:"/\\|?*\x00-\x1f]/g, "")
          .trim()
          .slice(0, 120);
        return `${clean || "SongBox-Song"}.mp3`;
      }

      function triggerDownload() {
        if (!objectUrl) return;
        const link = document.createElement("a");
        link.href = objectUrl;
        link.download = filename;
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      async function prepare(rawUrl, songTitle) {
        if (busy) return;
        let source;
        try {
          source = new URL(rawUrl);
          if (source.protocol !== "https:") throw new Error("Nur HTTPS-Adressen sind erlaubt.");
        } catch (error) {
          showError(error.message || "Die MP3-Adresse ist ungültig.");
          return;
        }

        busy = true;
        app.className = "loading";
        setup.classList.remove("visible");
        title.textContent = songTitle || "SongBox Hit";
        filename = safeFilename(songTitle);
        status.textContent = "Dein Song wird geladen …";
        button.disabled = true;
        bar.style.width = "8%";

        try {
          const response = await fetch(source.href, { mode: "cors", credentials: "omit" });
          if (!response.ok) throw new Error(`Der Musikserver antwortet mit Fehler ${response.status}.`);

          const total = Number(response.headers.get("content-length")) || 0;
          let blob;
          if (response.body && total) {
            const reader = response.body.getReader();
            const chunks = [];
            let received = 0;
            while (true) {
              const part = await reader.read();
              if (part.done) break;
              chunks.push(part.value);
              received += part.value.length;
              bar.style.width = `${Math.max(8, Math.min(96, received / total * 100))}%`;
            }
            blob = new Blob(chunks, { type: "audio/mpeg" });
          } else {
            bar.style.width = "55%";
            blob = await response.blob();
          }
          if (!blob.size) throw new Error("Der Musikserver hat eine leere Datei geliefert.");

          if (objectUrl) URL.revokeObjectURL(objectUrl);
          objectUrl = URL.createObjectURL(blob);
          app.className = "ready";
          status.textContent = "Fertig! Der Download sollte jetzt starten.";
          button.disabled = false;
          button.textContent = "⬇ Song herunterladen";
          triggerDownload();
        } catch (error) {
          showError(error.message || "Der Song konnte nicht geladen werden.");
        } finally {
          busy = false;
        }
      }

      function showError(message) {
        app.className = "error";
        status.textContent = message;
        bar.style.width = "0";
        button.disabled = !objectUrl;
        setup.classList.add("visible");
      }

      button.addEventListener("click", triggerDownload);
      setup.addEventListener("submit", event => {
        event.preventDefault();
        const next = new URLSearchParams({ url: urlInput.value, title: titleInput.value });
        location.hash = next.toString();
        prepare(urlInput.value, titleInput.value);
      });

      const params = parameters();
      const source = params.get("url") || "";
      const songTitle = params.get("title") || "SongBox Hit";
      if (source) {
        prepare(source, songTitle);
      } else {
        title.textContent = "Download testen";
        showError("Im Link fehlt noch eine MP3-Adresse.");
      }

      addEventListener("beforeunload", () => {
        if (objectUrl) URL.revokeObjectURL(objectUrl);
      });
    })();
  </script>
</body>
</html>
