<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101014">
  <title>SongBox – Dein Song</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #8b5cf6;
      --accent-2: #3b82f6;
      --surface: #18181d;
      --line: rgba(255, 255, 255, .1);
      --muted: #a1a1aa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      color: #fff;
      background: #0f0f12;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      width: min(100% - 40px, 480px);
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 0 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .brand { font-size: 17px; font-weight: 750; letter-spacing: -.02em; }
    .brand span { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .08em; }

    main {
      width: min(100% - 40px, 480px);
      margin: 0 auto;
      padding: 28px 0 max(40px, env(safe-area-inset-bottom));
    }

    .card {
      padding: clamp(24px, 7vw, 38px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
    }

    .mark {
      width: 44px;
      height: 44px;
      margin-bottom: 30px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-size: 21px;
      font-weight: 800;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(30px, 9vw, 44px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    #status {
      min-height: 24px;
      margin: 18px 0 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .progress {
      height: 4px;
      margin: 0 0 26px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
    }

    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .25s ease;
    }

    button {
      width: 100%;
      min-height: 54px;
      padding: 14px 18px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font: inherit;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .12s ease, opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.98); }
    button:disabled { cursor: wait; opacity: .42; }

    .hint {
      margin: 13px 0 0;
      color: #71717a;
      font-size: 12px;
      line-height: 1.45;
    }

    .setup {
      display: none;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      text-align: left;
    }

    .setup.visible { display: block; }
    label { display: block; margin: 14px 0 7px; font-size: 13px; font-weight: 650; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: #fff;
      background: #111115;
      font: inherit;
      font-size: 14px;
    }
    input:focus { border-color: var(--accent); }
    .setup button { margin-top: 16px; }

    .error #status { color: #fca5a5; }
    .ready .progress > span { width: 100% !important; }
  </style>
</head>
<body>
  <header><div class="brand">SongBox <span>DOWNLOAD</span></div></header>
  <main id="app">
    <section class="card">
      <div class="mark" aria-hidden="true">♪</div>
      <p class="eyebrow">Dein persönlicher Song</p>
      <h1 id="title">SongBox Hit</h1>
      <p id="status" role="status" aria-live="polite">Download wird vorbereitet …</p>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <button id="download" type="button" disabled>⬇ Song herunterladen</button>
      <p class="hint" id="hint">Falls dein Browser nicht automatisch startet, tippe auf den Button.</p>

      <form class="setup" id="setup">
        <p class="hint">Zum lokalen Testen eine öffentliche MP3-Adresse einfügen:</p>
        <label for="url-input">MP3-Adresse</label>
        <input id="url-input" type="url" inputmode="url" placeholder="https://…/song.mp3" required>
        <label for="title-input">Songtitel</label>
        <input id="title-input" type="text" value="Mein Song" maxlength="100">
        <button type="submit">Test starten</button>
      </form>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const app = document.querySelector("#app");
      const title = document.querySelector("#title");
      const status = document.querySelector("#status");
      const bar = document.querySelector("#bar");
      const button = document.querySelector("#download");
      const setup = document.querySelector("#setup");
      const urlInput = document.querySelector("#url-input");
      const titleInput = document.querySelector("#title-input");
      let objectUrl = "";
      let filename = "SongBox-Song.mp3";
      let busy = false;

      function parameters() {
        return new URLSearchParams(location.hash.replace(/^#/, ""));
      }

      function safeFilename(value) {
        const clean = String(value || "SongBox-Song")
          .normalize("NFC")
          .replace(/[<>:"/\\|?*\x00-\x1f]/g, "")
          .trim()
          .slice(0, 120);
        return `${clean || "SongBox-Song"}.mp3`;
      }

      function triggerDownload() {
        if (!objectUrl) return;
        const link = document.createElement("a");
        link.href = objectUrl;
        link.download = filename;
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      async function prepare(rawUrl, songTitle) {
        if (busy) return;
        let source;
        try {
          source = new URL(rawUrl);
          if (source.protocol !== "https:") throw new Error("Nur HTTPS-Adressen sind erlaubt.");
        } catch (error) {
          showError(error.message || "Die MP3-Adresse ist ungültig.");
          return;
        }

        busy = true;
        app.className = "loading";
        setup.classList.remove("visible");
        title.textContent = songTitle || "SongBox Hit";
        filename = safeFilename(songTitle);
        status.textContent = "Dein Song wird geladen …";
        button.disabled = true;
        bar.style.width = "8%";

        try {
          const response = await fetch(source.href, { mode: "cors", credentials: "omit" });
          if (!response.ok) throw new Error(`Der Musikserver antwortet mit Fehler ${response.status}.`);

          const total = Number(response.headers.get("content-length")) || 0;
          let blob;
          if (response.body && total) {
            const reader = response.body.getReader();
            const chunks = [];
            let received = 0;
            while (true) {
              const part = await reader.read();
              if (part.done) break;
              chunks.push(part.value);
              received += part.value.length;
              bar.style.width = `${Math.max(8, Math.min(96, received / total * 100))}%`;
            }
            blob = new Blob(chunks, { type: "audio/mpeg" });
          } else {
            bar.style.width = "55%";
            blob = await response.blob();
          }
          if (!blob.size) throw new Error("Der Musikserver hat eine leere Datei geliefert.");

          if (objectUrl) URL.revokeObjectURL(objectUrl);
          objectUrl = URL.createObjectURL(blob);
          app.className = "ready";
          status.textContent = "Fertig! Der Download sollte jetzt starten.";
          button.disabled = false;
          button.textContent = "⬇ Song herunterladen";
          triggerDownload();
        } catch (error) {
          showError(error.message || "Der Song konnte nicht geladen werden.");
        } finally {
          busy = false;
        }
      }

      function showError(message) {
        app.className = "error";
        status.textContent = message;
        bar.style.width = "0";
        button.disabled = !objectUrl;
        setup.classList.add("visible");
      }

      button.addEventListener("click", triggerDownload);
      setup.addEventListener("submit", event => {
        event.preventDefault();
        const next = new URLSearchParams({ url: urlInput.value, title: titleInput.value });
        location.hash = next.toString();
        prepare(urlInput.value, titleInput.value);
      });

      const params = parameters();
      const source = params.get("url") || "";
      const songTitle = params.get("title") || "SongBox Hit";
      if (source) {
        prepare(source, songTitle);
      } else {
        title.textContent = "Download testen";
        showError("Im Link fehlt noch eine MP3-Adresse.");
      }

      addEventListener("beforeunload", () => {
        if (objectUrl) URL.revokeObjectURL(objectUrl);
      });
    })();
  </script>
</body>
</html>
